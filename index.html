<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Billog Studio - Privacy Policies</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fffbf0;
    --text: #3d405b;
    --muted: #6b6e87;
    --accent: #e07a5f;
    --border: #3d405b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a2e;
      --text: #f8f4e3;
      --muted: #b8b3a3;
      --accent: #e8927b;
      --border: #f8f4e3;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 3rem 1.5rem;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.75rem;
    margin-bottom: 0.25rem;
  }
  p.subtitle {
    color: var(--muted);
    margin-top: 0;
    margin-bottom: 2rem;
  }
  ul.apps {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  ul.apps li + li {
    margin-top: 0.75rem;
  }
  ul.apps a {
    display: block;
    padding: 1rem 1.25rem;
    border: 2px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
  }
  ul.apps a:hover {
    color: var(--accent);
    border-color: var(--accent);
  }
</style>
</head>
<body>
<main>
  <h1>Billog Studio</h1>
  <p class="subtitle">Privacy policies for our published apps.</p>
  <ul class="apps">
    <li><a href="/privacy-policies/skyscrapers/">Skyscrapers: Tower Puzzle</a></li>
    <li><a href="/privacy-policies/scoundrel-roguelite/">Scoundrel Roguelite - Card Game</a></li>
  </ul>
</main>
</body>
</html>
